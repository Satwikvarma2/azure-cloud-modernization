<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 530" role="img" aria-labelledby="title desc">
<title id="title">Synapse to Logic App using a private endpoint</title>
<desc id="desc">Conceptual diagram: Synapse Web Activity using managed identity resolves the Logic App hostname in private DNS to the private endpoint IP 10.0.1.6, travels over a supported private network path into VNet 10.0.0.0/16 subnet 10.0.1.0/24, through the private endpoint NIC to the Logic App, which validates the Entra token. An independent VM NIC illustrates subnet membership.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#202b37}.h{font-size:26px;font-weight:700}.sub{font-size:15px;fill:#59697a}.l{font-size:17px;font-weight:700}.s{font-size:14px;fill:#4d5c6a}.n{font-size:12px;font-weight:700;fill:#237056}.arr{stroke:#506579;stroke-width:2.5;fill:none;marker-end:url(#a)}.box{fill:#fff;stroke:#bccbd1;stroke-width:1.5}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#506579"/></marker></defs>
<rect width="1050" height="530" rx="18" fill="white"/>
<text x="32" y="49" class="h">Logic App private endpoint</text>
<text x="32" y="73" class="sub">Private connectivity and identity-based authorization are separate layers</text>
<rect x="32" y="107" width="239" height="111" rx="12" class="box"/><text x="151" y="142" class="l" text-anchor="middle">Synapse Web Activity</text><text x="151" y="167" class="s" text-anchor="middle">UAMI + Entra OAuth token</text><text x="151" y="189" class="s" text-anchor="middle">HTTPS request</text>
<rect x="326" y="116" width="213" height="92" rx="12" fill="#f2f8fd" stroke="#99b8d1"/><text x="432" y="147" class="l" text-anchor="middle">Private DNS</text><text x="432" y="170" class="s" text-anchor="middle">Hostname → 10.0.1.6</text><text x="432" y="189" class="s" text-anchor="middle">DNS zone, not a NIC</text>
<path d="M271 162H326" class="arr"/><text x="299" y="145" font-size="12" text-anchor="middle">1</text>
<rect x="600" y="107" width="416" height="268" rx="16" fill="#eef7f1" stroke="#94c2a4" stroke-width="2"/>
<text x="624" y="141" class="l" fill="#216343">VNet · 10.0.0.0/16</text>
<rect x="622" y="157" width="370" height="194" rx="12" fill="#fbfefb" stroke="#b9d7c4" stroke-dasharray="5 4"/>
<text x="642" y="181" class="s">Subnet · 10.0.1.0/24</text>
<rect x="642" y="207" width="144" height="90" rx="10" class="box"/><text x="714" y="236" class="l" text-anchor="middle">VM NIC</text><text x="714" y="261" class="s" text-anchor="middle">10.0.1.4</text><text x="714" y="280" font-size="12" text-anchor="middle" fill="#687582">Other subnet resource</text>
<rect x="810" y="207" width="163" height="90" rx="10" fill="#e0f3e8" stroke="#5eac82" stroke-width="2"/><text x="891" y="235" class="l" text-anchor="middle">Private endpoint</text><text x="891" y="255" class="s" text-anchor="middle">NIC</text><text x="891" y="278" font-size="14" text-anchor="middle" fill="#237056" font-weight="700">10.0.1.6</text>
<path d="M539 162H560V254H810" class="arr"/><text x="678" y="240" class="s" text-anchor="middle">Private route</text>
<path d="M891 297V404H775" class="arr"/>
<rect x="528" y="404" width="247" height="92" rx="12" fill="#eef6ff" stroke="#8cadd4" stroke-width="1.5"/><text x="652" y="436" class="l" text-anchor="middle">Azure Logic App</text><text x="652" y="461" class="s" text-anchor="middle">Validate token + authorize caller</text><text x="652" y="480" class="s" text-anchor="middle">Then run workflow</text>
<rect x="32" y="277" width="490" height="101" rx="12" fill="#f7f9fb" stroke="#d4dce3"/>
<text x="53" y="307" class="l">Important</text><text x="53" y="332" class="s">Synapse needs a supported private network route.</text><text x="53" y="354" class="s">Private DNS and a private endpoint alone are not enough.</text>
<text x="34" y="514" font-size="12" fill="#6c7985">Illustrative IP addresses • Conceptual diagram • Public access disabled only after connectivity testing</text>
</svg>