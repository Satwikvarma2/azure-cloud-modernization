<!-- Labels -->
<g font-family="Arial,Helvetica,sans-serif">
<text x="194" y="583" font-size="26" font-weight="700" fill="#172432">Azure Synapse</text>
<text x="194" y="615" font-size="19" fill="#657280">Web Activity</text>
<text x="562" y="405" font-size="26" font-weight="700" fill="#172432">Microsoft Entra ID</text>
<text x="562" y="437" font-size="19" fill="#657280">OAuth 2.0 access token</text>
<text x="939" y="583" font-size="26" font-weight="700" fill="#172432">Azure Logic App</text>
<text x="939" y="615" font-size="19" fill="#657280">Validate &amp; execute</text>
<text x="1390" y="584" font-size="22" font-weight="700" fill="#172432">Microsoft</text>
<text x="1390" y="609" font-size="22" font-weight="700" fill="#172432">Graph API</text>
<text x="1390" y="638" font-size="18" fill="#657280">Send email</text>
</g>
<path d="M65 810 H500 M1150 810 H1525" stroke="#A9B1B7" stroke-width="1.5"/>
