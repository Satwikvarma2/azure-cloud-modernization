<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
<title id="title">Secure email notification flow</title>
<desc id="desc">Four-stage conceptual flow: Azure Synapse, Microsoft Entra ID, Azure Logic App, Microsoft Graph. Synapse receives an access token from Entra ID, then calls the Logic App over HTTPS. The Logic App uses separately authorized access to Microsoft Graph to send email.</desc>
<rect width="1200" height="390" fill="#FAF9F6"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="55" y="71" fill="#19252F" font-size="35" font-weight="700">Secure email notification flow</text>
<text x="55" y="103" fill="#65717A" font-size="17">Azure Synapse · Microsoft Entra ID · Logic Apps · Microsoft Graph</text>
<g fill="#FFFFFF" stroke="#D9DEE1" stroke-width="1.5">
<rect x="55" y="159" width="242" height="117" rx="12"/>
<rect x="338" y="159" width="242" height="117" rx="12"/>
<rect x="621" y="159" width="242" height="117" rx="12"/>
<rect x="904" y="159" width="242" height="117" rx="12"/>
</g>
<g stroke="#CD6A42" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
<path d="M306 218 H326 M320 211 L327 218 L320 225"/>
<path d="M589 218 H609 M603 211 L610 218 L603 225"/>
<path d="M872 218 H892 M886 211 L893 218 L886 225"/>
</g>
<g fill="#1E2A33" font-size="23" font-weight="700">
<text x="78" y="205">Azure Synapse</text>
<text x="361" y="205">Microsoft Entra ID</text>
<text x="644" y="205">Azure Logic App</text>
<text x="927" y="205">Microsoft Graph</text>
</g>
<g fill="#66737D" font-size="17">
<text x="78" y="242">Web Activity</text>
<text x="361" y="242">Issues access token</text>
<text x="644" y="242">Validates request</text>
<text x="927" y="242">Sends email</text>
</g>
<line x1="55" y1="327" x2="1145" y2="327" stroke="#DBDEE0"/>
<text x="55" y="353" fill="#697680" font-size="16">DEV / PPE / PROD</text>
<text x="240" y="353" fill="#697680" font-size="16">Separate app registrations by environment</text>
</g>
</svg>